<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Peter · Brinquedos Educativos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#00355D; --navy2:#012a4a; --teal:#00E4AB; --blue:#0071C7; --green:#00BA8B;
    --cream:#FBF6EC; --cream2:#F4ECDC; --wood:#E7D3B3; --wood2:#D9BE97;
    --ink:#00355D; --card:#FFFFFF; --line:#ECE1CE; --muted:#6E7A85;
    --sans:'Montserrat',"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    --shadow:0 14px 30px -18px rgba(0,40,70,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  /* HEADER */
  header{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
  .hbar{display:flex;align-items:center;gap:14px;padding:11px 20px;max-width:1120px;margin:0 auto}
  .hlogo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#fff}
  .hlogo img{height:34px;width:auto}
  .hlogo .fb{font-weight:900;color:#fff}
  .hnav{margin-left:auto;display:flex;align-items:center;gap:8px}
  .hnav a.link{font-size:13px;font-weight:600;color:#DCEBF4;padding:8px 10px;border-radius:9px}
  .hnav a.link:hover{background:rgba(255,255,255,.1)}
  .cartbtn{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:var(--navy);font-weight:800;
    font-size:13.5px;border:none;border-radius:11px;padding:9px 14px;cursor:pointer}
  .cartbtn .badge{background:var(--navy);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;
    display:inline-grid;place-items:center;padding:0 5px}

  /* HERO */
  .hero{background:radial-gradient(120% 90% at 82% -10%,rgba(0,228,171,.22),transparent 55%),linear-gradient(170deg,var(--navy),var(--navy2));color:#fff;padding:34px 0 96px;position:relative;overflow:hidden}
  .hero .spark{position:absolute;opacity:.5}
  .hero .inner{text-align:center;position:relative}
  .hero img.mark{height:88px;width:auto;margin:0 auto 14px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
  .hero h1{font-size:clamp(26px,4.4vw,42px);font-weight:900;line-height:1.05;letter-spacing:-.01em}
  .hero p{max-width:56ch;margin:10px auto 0;color:#CFE0EC;font-size:15.5px}
  .hero .waln{display:inline-flex;margin-top:16px}

  /* AGE DOORS */
  .doors{max-width:1120px;margin:-70px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;position:relative;z-index:5}
  @media(max-width:720px){.doors{grid-template-columns:1fr}}
  .door{border-radius:20px;padding:22px 20px 20px;min-height:150px;position:relative;overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease;display:flex;flex-direction:column;justify-content:flex-end;color:var(--navy)}
  .door:hover{transform:translateY(-4px)}
  .door .em{position:absolute;top:10px;right:14px;font-size:52px;opacity:.9}
  .door h3{font-size:22px;font-weight:900}
  .door small{font-weight:600;opacity:.85;font-size:13px}
  .d1{background:linear-gradient(160deg,#FFF3D6,var(--wood))}
  .d2{background:linear-gradient(160deg,#CFF3EA,#8fe0cd)}
  .d3{background:linear-gradient(160deg,#CFE6F6,#9cc9ec)}
  .herobg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.30;z-index:0}
  .hero .inner{position:relative;z-index:2}
  .door .doorimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .door .veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,53,93,0) 25%,rgba(0,53,93,.85));opacity:0;pointer-events:none}
  .door.hasimg .veil{opacity:1}
  .door h3,.door small,.door .em{position:relative;z-index:2}
  .door.hasimg h3,.door.hasimg small{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.45)}
  .door.hasimg .em{display:none}
  .sobreimg{width:100%;border-radius:16px;margin:14px 0 4px;box-shadow:var(--shadow);aspect-ratio:2/1;object-fit:cover}

  /* SECTIONS */
  section.blk{padding:44px 0}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
  h2.sec{font-size:clamp(21px,3vw,28px);font-weight:900;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:15px}
  .shelf{display:flex;gap:14px;overflow-x:auto;padding:16px 4px 8px;scroll-snap-type:x mandatory}
  .shelf::-webkit-scrollbar{height:8px}.shelf::-webkit-scrollbar-thumb{background:var(--wood2);border-radius:9px}
  .shelf .card{min-width:210px;scroll-snap-align:start}

  /* PRODUCT CARD */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);
    display:flex;flex-direction:column;transition:transform .14s ease}
  .card:hover{transform:translateY(-3px)}
  .card .ph{aspect-ratio:1;background:#fff;position:relative;display:grid;place-items:center;cursor:pointer}
  .card .ph img{width:100%;height:100%;object-fit:contain;padding:14px}
  .card .ph .emoji{font-size:60px}
  .card .agebdg{position:absolute;top:10px;left:10px;background:var(--teal);color:var(--navy);font-weight:800;font-size:11px;border-radius:99px;padding:3px 9px}
  .card .escola{position:absolute;top:10px;right:10px;background:var(--navy);color:#fff;font-weight:700;font-size:10px;border-radius:99px;padding:3px 8px;display:flex;align-items:center;gap:4px}
  .card .body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card .nm{font-weight:700;font-size:14px;line-height:1.25;cursor:pointer}
  .card .cat{font-size:11px;color:var(--muted);font-weight:600}
  .card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
  .card .price{font-weight:900;font-size:16px;color:var(--navy)}
  .add{background:var(--navy);color:#fff;border:none;border-radius:10px;font-weight:800;font-size:12.5px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .add:hover{background:#012a4a}

  /* CURADORIA strip */
  .prop{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:30px 26px;text-align:center;margin:6px 0}
  .prop h2{color:#fff}.prop .sub{color:#CFE0EC}
  .cur{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:16px}
  .cur .pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .cur .pill:hover{background:var(--teal);color:var(--navy);border-color:var(--teal)}

  /* SCHOOLS band */
  .schools{display:flex;align-items:center;gap:16px;background:var(--cream2);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-top:8px}
  .schools .ic{font-size:40px}
  .schools b{font-size:16px}.schools p{color:var(--muted);font-size:14px}

  /* CATALOG filters */
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .chipset{display:flex;gap:7px;flex-wrap:wrap}
  .fchip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--navy)}
  .fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px}
  .search input{border:none;outline:none;font:inherit;font-size:14px;width:100%;background:transparent;color:var(--ink)}
  select.fsel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:13.5px;font-weight:600;color:var(--navy)}
  .rescount{color:var(--muted);font-size:13px;margin:14px 0 0}

  /* MODAL */
  .ov{position:fixed;inset:0;background:rgba(0,20,40,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
  .ov.on{display:flex}
  .modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;position:relative;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
  .modal .x{position:absolute;top:12px;right:12px;background:#fff;border:1px solid var(--line);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;z-index:2}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  @media(max-width:620px){.mgrid{grid-template-columns:1fr}}
  .mph{background:#fff;aspect-ratio:1;display:grid;place-items:center;border-right:1px solid var(--line)}
  .mph .emoji{font-size:96px}.mph img{width:100%;height:100%;object-fit:contain;padding:22px}
  .mbody{padding:24px}
  .mbody .cat{color:var(--blue);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
  .mbody h3{font-size:23px;font-weight:900;margin:4px 0 6px}
  .mbody .desc{color:#3a4a57;font-size:14.5px}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
  .tag{background:var(--cream2);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600}
  .mprice{font-weight:900;font-size:26px;color:var(--navy);margin-top:6px}
  .qtyrow{display:flex;align-items:center;gap:12px;margin-top:14px}
  .qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .qty button{width:38px;height:40px;border:none;background:#fff;font-size:18px;cursor:pointer;color:var(--navy)}
  .qty span{min-width:34px;text-align:center;font-weight:800}
  .bigadd{flex:1;background:var(--teal);color:var(--navy);border:none;border-radius:12px;font-weight:900;font-size:15px;padding:12px;cursor:pointer}

  /* CART drawer */
  .drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--cream);z-index:70;
    transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4)}
  .drawer.on{transform:translateX(0)}
  .drawer .dh{background:var(--navy);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between}
  .drawer .dh b{font-size:16px}
  .drawer .dh button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
  .ditems{flex:1;overflow:auto;padding:14px}
  .ditem{display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:10px}
  .ditem .tph{width:52px;height:52px;border-radius:9px;background:var(--cream2);display:grid;place-items:center;font-size:26px;flex:0 0 auto;overflow:hidden}
  .ditem .tph img{width:100%;height:100%;object-fit:contain}
  .ditem .info{flex:1;min-width:0}
  .ditem .info b{font-size:13px;font-weight:700;display:block;line-height:1.2}
  .ditem .info .p{color:var(--muted);font-size:12px}
  .ditem .qty{transform:scale(.82);transform-origin:left;margin-top:4px}
  .drm{background:none;border:none;color:#c0392b;font-size:12px;cursor:pointer;font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
  .dfoot{border-top:1px solid var(--line);padding:16px 18px;background:#fff}
  .drow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
  .drow.tot{font-weight:900;font-size:18px;color:var(--navy)}
  .sendwa{width:100%;margin-top:12px;background:#25D366;color:#fff;border:none;border-radius:13px;font-weight:900;font-size:15px;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
  .clearc{width:100%;margin-top:8px;background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer}

  footer{background:var(--navy);color:#CFE0EC;padding:36px 0 46px;margin-top:30px}
  footer .cols{display:flex;flex-wrap:wrap;gap:26px;justify-content:space-between}
  footer a.fl{display:block;color:#EAF2F8;font-weight:600;font-size:14px;padding:5px 0}
  footer .tag{color:var(--teal);font-weight:800}
  footer small{color:#9db4c7}
  .backdrop{position:fixed;inset:0;background:rgba(0,20,40,.4);z-index:65;display:none}
  .backdrop.on{display:block}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <a class="hlogo" href="#/" onclick="go('/')">
      <img src="HORIZONTAL-POSITIVA.png" alt="Peter" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
      <span class="fb" style="display:none">peter</span>
    </a>
    <nav class="hnav">
      <a class="link" href="#/catalogo" onclick="go('/catalogo')">Catálogo</a>
      <a class="link" href="#/sobre" onclick="go('/sobre')">Sobre</a>
      <button class="cartbtn" onclick="openCart()">🧺 Orçamento <span class="badge" id="cartCount">0</span></button>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div class="cols">
      <div>
        <div style="font-weight:900;color:#fff;font-size:18px">Peter · Brinquedos Educativos</div>
        <div class="tag">Brincou, Aprendeu!</div>
        <small>Curadoria de brinquedos que ensinam brincando.</small>
      </div>
      <div>
        <a class="fl" href="https://wa.me/5519988807411" target="_blank">💬 WhatsApp</a>
        <a class="fl" href="https://www.instagram.com/peterbrinquedos/" target="_blank">📷 @peterbrinquedos</a>
        <a class="fl" href="https://maps.app.goo.gl/M7pKX8Pk1SvYd5pJA" target="_blank">📍 Estoque (visita com agendamento)</a>
      </div>
    </div>
  </div>
</footer>

<div class="backdrop" id="backdrop" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><b>Meu orçamento</b><button onclick="closeCart()">×</button></div>
  <div class="ditems" id="ditems"></div>
  <div class="dfoot">
    <div class="drow tot"><span>Itens no orçamento</span><span id="subtotal">0</span></div>
    <div class="drow"><small style="color:var(--muted)">Sem compromisso. Os valores e o frete são combinados no WhatsApp.</small></div>
    <button class="sendwa" onclick="sendWhats()">💬 Enviar orçamento no WhatsApp</button>
    <button class="clearc" onclick="clearCart()">limpar orçamento</button>
  </div>
</aside>

<div class="ov" id="ov" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>

<script>
const WA="5519988807411";
const FAIXAS=[["0-2","0 a 2 anos","🍼","img/idade-0-2.jpg"],["3-5","3 a 5 anos","🧒","img/idade-3-5.jpg"],["6+","6 anos ou mais","🎒","img/idade-6.jpg"]];
const DEV={coordenacao:"Coordenação",logica:"Lógica",linguagem:"Linguagem",criatividade:"Criatividade",socializacao:"Socialização",equilibrio:"Equilíbrio"};
let PRODUCTS=[], cart=load();

/* ---- data load (fetch on http, fallback to inline for file://) ---- */
const INLINE=document.getElementById('data');
async function boot(){
  try{ const r=await fetch('products.json'); PRODUCTS=await r.json(); }
  catch(e){ PRODUCTS=JSON.parse(document.getElementById('seed').textContent); }
  updateCount(); route();
}
window.addEventListener('hashchange',route);

/* ---- helpers ---- */
function brl(v){return 'R$ '+v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function load(){try{return JSON.parse(localStorage.getItem('peter_orc')||'{}')}catch(e){return {}}}
function save(){localStorage.setItem('peter_orc',JSON.stringify(cart))}
function go(p){location.hash='#'+p;window.scrollTo(0,0)}
function phImg(p,cls){return p.imagem?`<img src="${p.imagem}" referrerpolicy="no-referrer" loading="lazy" alt="${p.nome}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="emoji" style="display:none;place-items:center;width:100%;height:100%">${p.emoji||'🧸'}</div>`:`<div class="emoji">${p.emoji||'🧸'}</div>`;}

/* ---- cards ---- */
function card(p){
  return `<div class="card">
    <div class="ph" onclick="openProduct('${p.sku}')">
      <div class="agebdg">${p.faixa==='6+'?'6+ anos':p.faixa+' anos'}</div>
      ${p.escolas?'<div class="escola">🏫 escolas</div>':''}
      ${phImg(p)}
    </div>
    <div class="body">
      <div class="cat">${p.categoria}</div>
      <div class="nm" onclick="openProduct('${p.sku}')">${p.nome}</div>
      <div class="foot" style="justify-content:flex-end">
        <button class="add" onclick="addItem('${p.sku}',1,true)">+ orçamento</button></div>
    </div></div>`;
}

/* ---- routes ---- */
function route(){
  const h=location.hash.replace('#','')||'/';
  const app=document.getElementById('app');
  if(h.startsWith('/catalogo')) return renderCatalog(app,h);
  if(h==='/sobre') return renderSobre(app);
  return renderHome(app);
}

function renderHome(app){
  const dest=PRODUCTS.slice(0,8);
  app.innerHTML=`
  <section class="hero">
    <img class="herobg" src="img/hero-loja.jpg" alt="" onerror="this.remove()">
    <svg class="spark" style="top:26px;left:8%" width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M12 0l2.5 9.5L24 12l-9.5 2.5L12 24l-2.5-9.5L0 12l9.5-2.5z"/></svg>
    <div class="wrap inner">
      <img class="mark" src="VERTICAL-POSITIVA.png" alt="Peter" onerror="this.style.display='none'">
      <h1>Brinquedos que ensinam brincando</h1>
      <p>Curadoria por idade, com qualidade segura e o olhar de quem entende de desenvolvimento infantil. Os mesmos brinquedos em que as escolas confiam.</p>
    </div>
  </section>
  <div class="doors">
    ${FAIXAS.map((f,i)=>`<div class="door d${i+1}" onclick="go('/catalogo?idade=${encodeURIComponent(f[0])}')">
      <img class="doorimg" src="${f[3]}" alt="${f[1]}" onload="this.closest('.door').classList.add('hasimg')" onerror="this.remove()">
      <span class="veil"></span>
      <span class="em">${f[2]}</span><h3>${f[1]}</h3><small>Ver brinquedos ›</small></div>`).join('')}
  </div>
  <section class="blk"><div class="wrap">
    <div class="eyebrow">Prateleira</div><h2 class="sec">Queridinhos da Peter</h2>
    <div class="shelf">${dest.map(card).join('')}</div>
    <div style="margin-top:10px"><button class="add" style="background:var(--navy)" onclick="go('/catalogo')">Ver catálogo completo ›</button></div>
  </div></section>
  <section class="blk" style="padding-top:0"><div class="wrap">
    <div class="prop">
      <div class="eyebrow" style="color:var(--teal)">Diversão com propósito</div>
      <h2 class="sec">Cada brinquedo trabalha uma habilidade</h2>
      <p class="sub">Escolha pelo que você quer desenvolver no seu pequeno.</p>
      <div class="cur">
        ${Object.entries(DEV).map(([k,v])=>`<span class="pill" onclick="go('/catalogo?dev=${k}')">${v}</span>`).join('')}
      </div>
    </div>
    <div class="schools"><div class="ic">🏫</div><div><b>Usado por escolas</b><p>Boa parte da nossa curadoria já é usada em escolas de educação infantil. Confiança que vem da sala de aula pra casa da sua família.</p></div></div>
  </div></section>`;
}

function renderCatalog(app,h){
  const q=new URLSearchParams(h.split('?')[1]||'');
  const state={idade:q.get('idade')||'',cat:q.get('cat')||'',dev:q.get('dev')||'',mat:q.get('mat')||'',q:q.get('q')||''};
  const cats=[...new Set(PRODUCTS.map(p=>p.categoria))].sort();
  app.innerHTML=`
  <section class="blk"><div class="wrap">
    <div class="eyebrow">Catálogo</div><h2 class="sec">Explore por idade e curadoria</h2>
    <div class="filters">
      <div class="search">🔎<input id="q" placeholder="Buscar brinquedo..." value="${state.q}"></div>
      <select class="fsel" id="cat"><option value="">Todas as categorias</option>${cats.map(c=>`<option ${state.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    <div class="filters" style="margin-top:8px">
      <div class="chipset" id="idadeset">
        ${['','0-2','3-5','6+'].map(f=>`<span class="fchip ${state.idade===f?'on':''}" data-idade="${f}">${f===''?'Todas as idades':(f==='6+'?'6+ anos':f+' anos')}</span>`).join('')}
      </div>
    </div>
    <div class="filters" style="margin-top:6px">
      <div class="chipset" id="devset">
        ${['',...Object.keys(DEV)].map(d=>`<span class="fchip ${state.dev===d?'on':''}" data-dev="${d}">${d===''?'Tudo que desenvolve':DEV[d]}</span>`).join('')}
      </div>
    </div>
    <p class="rescount" id="rescount"></p>
    <div class="grid" id="grid"></div>
  </div></section>`;
  const applyURL=()=>{const p=new URLSearchParams();Object.entries(state).forEach(([k,v])=>{if(v)p.set(k,v)});history.replaceState(null,'','#/catalogo'+(p.toString()?'?'+p:''));};
  function draw(){
    let r=PRODUCTS.filter(p=>
      (!state.idade||p.faixa===state.idade)&&
      (!state.cat||p.categoria===state.cat)&&
      (!state.dev||(p.desenvolve||[]).includes(state.dev))&&
      (!state.q||(p.nome+' '+p.descricao+' '+p.categoria).toLowerCase().includes(state.q.toLowerCase())));
    document.getElementById('grid').innerHTML=r.length?r.map(card).join(''):'<p class="empty">Nada encontrado com esses filtros. Tente afrouxar a busca 🙂</p>';
    document.getElementById('rescount').textContent=`${r.length} brinquedo${r.length!==1?'s':''}`;
    applyURL();
  }
  document.getElementById('q').oninput=e=>{state.q=e.target.value;draw()};
  document.getElementById('cat').onchange=e=>{state.cat=e.target.value;draw()};
  document.querySelectorAll('#idadeset .fchip').forEach(c=>c.onclick=()=>{state.idade=c.dataset.idade;document.querySelectorAll('#idadeset .fchip').forEach(x=>x.classList.toggle('on',x===c));draw()});
  document.querySelectorAll('#devset .fchip').forEach(c=>c.onclick=()=>{state.dev=c.dataset.dev;document.querySelectorAll('#devset .fchip').forEach(x=>x.classList.toggle('on',x===c));draw()});
  draw();
}

  const p=PRODUCTS.find(x=>x.sku===sku);if(!p)return;
  document.getElementById('modal').innerHTML=`
    <button class="x" onclick="closeModal()">×</button>
    <div class="mgrid">
      <div class="mph">${phImg(p)}</div>
      <div class="mbody">

        <p class="desc">${p.descricao}</p>
        <div class="tags">${(p.desenvolve||[]).map(d=>`<span class="tag">${DEV[d]||d}</span>`).join('')}</div>

    </div>`;

}
function mq(d){const s=document.getElementById('mqty');s.textContent=Math.max(1,(+s.textContent)+d)}
function closeModal(){document.getElementById('ov').classList.remove('on')}

/* ---- cart ---- */
function addItem(sku,qty,flash){cart[sku]=(cart[sku]||0)+qty;save();updateCount();renderCart();if(flash){bump()}}
function setQty(sku,q){if(q<=0)delete cart[sku];else cart[sku]=q;save();updateCount();renderCart()}
function clearCart(){cart={};save();updateCount();renderCart()}
function updateCount(){const n=Object.values(cart).reduce((a,b)=>a+b,0);document.getElementById('cartCount').textContent=n}
function bump(){const b=document.getElementById('cartCount');b.animate([{transform:'scale(1)'},{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:300})}
function openCart(){renderCart();document.getElementById('drawer').classList.add('on');document.getElementById('backdrop').classList.add('on')}
function closeCart(){document.getElementById('drawer').classList.remove('on');document.getElementById('backdrop').classList.remove('on')}
function cartList(){return Object.entries(cart).map(([sku,q])=>({p:PRODUCTS.find(x=>x.sku===sku),q})).filter(x=>x.p)}
function subtotal(){return cartList().reduce((a,{p,q})=>a+p.preco*q,0)}
function renderCart(){
  const items=cartList();
  document.getElementById('ditems').innerHTML=items.length?items.map(({p,q})=>`
    <div class="ditem"><div class="tph">${phImg(p)}</div>
      <div class="info"><b>${p.nome}</b><span class="p">${p.categoria} · cód. ${p.sku}</span>
        <div class="qty"><button onclick="setQty('${p.sku}',${q-1})">−</button><span>${q}</span><button onclick="setQty('${p.sku}',${q+1})">+</button></div>
      </div><button class="drm" onclick="setQty('${p.sku}',0)">remover</button></div>`).join('')
    :'<div class="empty">Seu orçamento está vazio.<br>Explore o catálogo e vá adicionando 🧸</div>';
  document.getElementById('subtotal').textContent=Object.values(cart).reduce((a,b)=>a+b,0);
}
function sendWhats(){
  const items=cartList();
  if(!items.length){alert('Adicione brinquedos ao orçamento primeiro 🙂');return;}
  let msg='Olá! Montei um orçamento no site da Peter 🧸\n\n';
  items.forEach(({p,q})=>{msg+=`- ${p.nome} (cód. ${p.sku}) — Qtd: ${q}\n`});
  msg+=`\nPode me passar os valores e como funciona a entrega? 🙂`;
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');
}

boot();
